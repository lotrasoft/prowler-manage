<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect Tenant</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Cpath fill=%22%232f5bea%22 d=%22M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3Z%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <style>
    main { max-width: 520px; margin: 32px auto; }
    .card { padding: 22px; }
    .steps { color: var(--text); }
    .steps li { margin: 4px 0; }
    #status { margin: 14px 0 0; font-weight: 600; }
    .spinner { display: inline-block; width: 12px; height: 12px; margin-right: 8px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>Connect Microsoft 365 tenant</h1>
      <ol class="steps small" id="steps"></ol>
      <p id="status"></p>
      <div class="dlg-actions" id="actions"></div>
    </section>
  </main>
  <script src="onboarding.js"></script>
</body>
</html>
